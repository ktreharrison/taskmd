[package]
name = "tkmd"
version = "0.2.3"
edition = "2024"
description = "Deterministic Program Management Engine & Multi-Agent MCP Server"
license = "MIT OR Apache-2.0"
authors = ["Ken Harrison <ktreharrison@gmail.com>"]
repository = "https://github.com/ktreharrison/tkmd"
default-run = "tk"

[lib]
name = "tkmd"
path = "src/lib.rs"

[[bin]]
name = "tkmd"
path = "src/bin/tkmd.rs"

[[bin]]
name = "tk"
path = "src/bin/tk.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "color"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
